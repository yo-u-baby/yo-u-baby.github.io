<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YO-Ü</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffaf3;--card:#ffffff;--text:#2b2a33;--muted:#6b6878;--accent:#ff7a59;--accent2:#5cc8c0;--line:#f0e6d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a22;--card:#26252f;--text:#f4f1ea;--muted:#aaa6b8;--accent:#ff8b6c;--accent2:#6fd6ce;--line:#38364a}}
:root[data-theme="dark"]{--bg:#1b1a22;--card:#26252f;--text:#f4f1ea;--muted:#aaa6b8;--accent:#ff8b6c;--accent2:#6fd6ce;--line:#38364a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.bar{display:flex;justify-content:flex-end;padding-top:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--text);padding:6px 16px;font:700 14px 'Cairo',Tahoma,sans-serif;cursor:pointer}
.lang button.on{background:var(--accent2);color:#fff}
header{padding:28px 0 40px;text-align:center}
.logo{font-size:44px}
h1{font-size:clamp(34px,7vw,54px);margin:8px 0 0;font-weight:900;letter-spacing:1px}
.sub{font-weight:700;font-size:20px;color:var(--accent2);margin-bottom:6px}
header p{color:var(--muted);max-width:520px;margin:0 auto 22px;font-size:18px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:700 17px 'Cairo',Tahoma,sans-serif;text-decoration:none;cursor:pointer}
h2{font-size:26px;margin:44px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.thumb{height:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.price{color:var(--accent);font-weight:700;margin-top:6px}
.steps .card b{display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--accent2);color:#fff;align-items:center;justify-content:center;margin-bottom:8px}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;max-width:520px;margin:0 auto}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:16px 'Cairo',Tahoma,sans-serif}
.contact{max-width:520px;margin:0 auto;text-align:center}.contact p{color:var(--muted);font-size:18px}#social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);padding:36px 0 28px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="bar"><div class="lang" dir="ltr"><button id="b-en" type="button">English</button><button id="b-ar" type="button">عربي</button></div></div>
<header>
  <div class="logo">🧸</div>
  <h1 dir="ltr">YO-Ü</h1>
  <div class="sub" data-t="sub"></div>
  <p data-t="intro"></p>
  <a class="btn" href="#contact" data-t="cta"></a>
</header>

<h2 data-t="h_cats"></h2>
<div class="grid" id="products"></div>

<h2 data-t="h_how"></h2>
<div class="grid steps" id="steps"></div>

<h2 id="contact" data-t="h_order"></h2>
<div class="contact"><p data-t="contact"></p><div id="social"></div></div>

<footer>© YO-Ü · <span data-t="foot"></span></footer>
</div>
<script>
var SOCIAL={instagram:"",facebook:""}; // حط لينك حسابك هنا بين العلامتين، مثال: "https://instagram.com/yourname"
var L={
ar:{sub:"ديكور أوض الأطفال",intro:"قطع ديكور مميزة تخلّي أوضة طفلك مكان بيحبه، تصميم على ذوقك وتوصيل لحد البيت.",cta:"اطلب تصميمك",
h_cats:"أقسامنا",h_how:"إزاي تطلب؟",h_order:"اطلب دلوقتي",foot:"الدفع كاش عند الاستلام",soon:"صور وتفاصيل قريبًا",from:"ابتداءً من ٠٠٠ جنيه",
contact:"للطلب أو الاستفسار تواصل معانا على حساباتنا وهنرد عليك في أقرب وقت.",instagram:"انستجرام",facebook:"فيسبوك",
cats:["أوض الأولاد","أوض البنات","أوض المواليد","حروف وأسماء","ستائر وإضاءة","ملصقات حيطان"],
steps:[["اختار","تصفح الأقسام وحدد اللي عجبك"],["كلمنا","ابعتلنا رسالة على حساباتنا"],["استلم","الدفع كاش عند الاستلام، من غير دفع أونلاين"]]},
en:{sub:"Kids Room Decor",intro:"Unique decor pieces that turn your child’s room into a place they love, designed your way and delivered to your door.",cta:"Order your design",
h_cats:"Our Collections",h_how:"How to order",h_order:"Order now",foot:"Cash on delivery",soon:"Photos and details coming soon",from:"From 000 EGP",
contact:"To order or ask a question, message us on our social accounts and we’ll reply soon.",instagram:"Instagram",facebook:"Facebook",
cats:["Boys’ Rooms","Girls’ Rooms","Nursery","Letters & Names","Curtains & Lighting","Wall Stickers"],
steps:[["Choose","Browse the collections and pick what you like"],["Message us","Send us a message on our social accounts"],["Receive","Pay cash on delivery, no online payment"]]}
};
var ICONS=["👦","👧","👶","🔤","🪟","🖼️"],BG=["#cfe8ff","#ffd9e6","#fff0c2","#d9f5e4","#e8dcff","#ffe0cc"];
function $(i){return document.getElementById(i)}
function setLang(l){
 var d=L[l];
 document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=d[e.getAttribute("data-t")]});
 var g="",s="",k="";
 d.cats.forEach(function(c,i){g+='<div class="card"><div class="thumb" style="background:'+BG[i]+'">'+ICONS[i]+'</div><h3>'+c+'</h3><p>'+d.soon+'</p><div class="price">'+d.from+'</div></div>'});
 d.steps.forEach(function(x,i){s+='<div class="card"><b>'+(i+1)+'</b><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'});
 ["instagram","facebook"].forEach(function(n){if(SOCIAL[n])k+='<a class="btn" target="_blank" rel="noopener" href="'+SOCIAL[n]+'">'+d[n]+'</a>'});
 $("products").innerHTML=g;$("steps").innerHTML=s;$("social").innerHTML=k;
 $("b-ar").className=l==="ar"?"on":"";$("b-en").className=l==="en"?"on":"";
 document.title="YO-Ü | "+d.sub;
 try{localStorage.setItem("lang",l)}catch(e){}
}
$("b-ar").onclick=function(){setLang("ar")};
$("b-en").onclick=function(){setLang("en")};
var saved="en";try{saved=localStorage.getItem("lang")||"en"}catch(e){}
setLang(saved==="ar"?"ar":"en");
</script>
</body>
</html>
