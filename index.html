<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf7f2;--card:#ffffff;--text:#4a3a2f;--muted:#7d6b5e;--accent:#d98763;--accent2:#84614a;--line:#eadfd3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a17;--card:#2a231f;--text:#f4ede6;--muted:#b9a99b;--accent:#e09b7e;--accent2:#c9a58c;--line:#3d322b}}
:root[data-theme="dark"]{--bg:#1f1a17;--card:#2a231f;--text:#f4ede6;--muted:#b9a99b;--accent:#e09b7e;--accent2:#c9a58c;--line:#3d322b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
.bar{display:flex;justify-content:flex-end;padding-top:14px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--text);padding:6px 16px;font:700 14px 'Cairo',Tahoma,sans-serif;cursor:pointer}
.lang button.on{background:var(--accent2);color:var(--bg)}
header{padding:28px 0 40px;text-align:center}
.logo img{width:min(280px,72vw);height:auto;display:block;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-size:clamp(34px,7vw,54px);margin:8px 0 0;font-weight:900;letter-spacing:1px}
.sub{font-weight:700;font-size:20px;color:var(--accent2);margin-bottom:6px}
header p{color:var(--muted);max-width:520px;margin:0 auto 22px;font-size:18px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:700 17px 'Cairo',Tahoma,sans-serif;text-decoration:none;cursor:pointer}
h2{font-size:26px;margin:44px 0 16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.thumb{height:120px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.price{color:var(--accent);font-weight:700;margin-top:6px}
.steps .card b{display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--accent2);color:var(--bg);align-items:center;justify-content:center;margin-bottom:8px}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;max-width:520px;margin:0 auto}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:16px 'Cairo',Tahoma,sans-serif}
.contact{max-width:520px;margin:0 auto;text-align:center}.contact p{color:var(--muted);font-size:18px}#social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);padding:36px 0 28px;font-size:14px}
</style>
</head>
